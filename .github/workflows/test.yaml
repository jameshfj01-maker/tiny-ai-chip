name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog and verilator
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator

      # The GDS flow stops on any Verilator warning, so check it here first (much faster).
      - name: Lint with Verilator
        run: |
          verilator --lint-only -Wall -Wno-DECLFILENAME \
            --top-module tt_um_jameshfj01_tiny_ai_chip \
            src/bitserial_seq.v src/mac_bitserial.v src/systolic_2x2.v src/project.v

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the tests fail, so check results.xml for failed tests
          python -m cocotb_tools.check_results results.xml

      - name: Run module unit tests
        run: |
          for dir in test/mac test/mac_serial test/mac_bitserial test/systolic test/demoboard; do
            echo "=== $dir ==="
            (cd $dir && make clean && make && python -m cocotb_tools.check_results results.xml)
          done

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: |
            test/results.xml
            test/mac/results.xml
            test/mac_serial/results.xml
            test/mac_bitserial/results.xml
            test/systolic/results.xml
            test/demoboard/results.xml
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/mac/results.xml
            test/mac_serial/results.xml
            test/mac_bitserial/results.xml
            test/systolic/results.xml
            test/demoboard/results.xml
            test/output/*
